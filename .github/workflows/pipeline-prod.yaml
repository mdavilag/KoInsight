name: pipeline-prod

# Publishes kinanino/koinsight:prod on every push to master.
# Promoting a change to production is therefore a merge of development into master.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pipeline-prod
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.repository == 'mdavilag/KoInsight'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The moving tag is what the server follows; the sha tag is what you
          # pin to when a deploy has to be rolled back.
          tags: |
            kinanino/koinsight:prod
            kinanino/koinsight:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
